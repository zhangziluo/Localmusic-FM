<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f5f0">
<title>极简FM</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>
<div id="app">

  <!-- 导入进度条（顶部浮层，导入 / 恢复曲库时显示） -->
  <div id="import-progress" class="import-progress" hidden aria-hidden="true">
    <div class="ip-row">
      <span class="ip-text" id="ip-text" role="status" aria-live="polite">正在导入</span>
      <span class="ip-count" id="ip-count"></span>
    </div>
    <div class="ip-track" id="ip-track" role="progressbar" aria-label="导入进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <i class="ip-fill" id="ip-fill"></i>
    </div>
  </div>

  <!-- LED 状态条 -->
  <div id="led">极简FM · 就绪</div>

  <!-- 数据卡片 + 左右极简竖推子 -->
  <div class="deck">
    <div class="fader">
      <span class="fader-label">音乐</span>
      <div class="fader-track">
        <input id="music-volume" type="range" min="0" max="100" step="1" value="100" aria-label="音乐音量">
      </div>
      <b class="fader-val" id="music-volume-val">100</b>
      <button class="rec-btn" id="btn-record" type="button" title="播放中才能录制" aria-label="录制当前声音" disabled>
        <span class="rec-dot"></span>
      </button>
    </div>

    <!-- 数据卡片（底色/字色/辉光跟随界面主题） -->
    <div id="dashboard" class="theme-dark">
      <div class="dash-time" id="dash-time">00:00:00</div>
      <div class="dash-info">
        <span class="dash-channel" title="频道"><span class="dash-label">CH</span><b id="dash-ch">1</b></span>
        <span class="dash-duration" title="累计时长"><span class="dash-label">TIME</span><b id="dash-dur">0000:00:00</b></span>
      </div>
    </div>

    <div class="fader">
      <span class="fader-label">底噪</span>
      <div class="fader-track">
        <input id="noise-volume" type="range" min="0" max="100" step="1" value="85" aria-label="底噪音量">
      </div>
      <b class="fader-val" id="noise-volume-val">85</b>
    </div>
  </div>

  <!-- 曲目信息 -->
  <div class="track-info">
    <div class="track-title" id="track-title">未播放</div>
    <div class="track-sub" id="track-sub">—</div>
  </div>
  <div class="lib-count" id="lib-count">尚未导入曲目</div>

  <!-- 进度条 -->
  <div class="progress-wrap">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <!-- 控制栏 -->
  <div class="controls">
    <button class="icon-btn" id="btn-import" title="导入文件夹（覆盖）">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        <line x1="12" y1="11" x2="12" y2="17"/>
        <polyline points="9 14 12 11 15 14"/>
      </svg>
    </button>
    <button class="icon-btn" id="btn-append" title="追加文件夹">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        <line x1="12" y1="9" x2="12" y2="17"/>
        <polyline points="9 13 12 10 15 13"/>
        <line x1="9" y1="17" x2="15" y2="17"/>
      </svg>
    </button>
    <button class="icon-btn" id="btn-prev" title="上一首">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <polygon points="19 20 9 12 19 4 19 20"/>
        <rect x="5" y="4" width="2" height="16" rx="1"/>
      </svg>
    </button>
    <button class="icon-btn play-btn" id="btn-play" title="播放/暂停">
      <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor" id="icon-play">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
    </button>
    <button class="icon-btn" id="btn-next" title="下一首">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <polygon points="5 4 15 12 5 20 5 4"/>
        <rect x="17" y="4" width="2" height="16" rx="1"/>
      </svg>
    </button>
    <button class="icon-btn heart" id="btn-heart" title="收藏">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
    </button>
    <button class="icon-btn" id="btn-settings" title="设置">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- 频道键盘 -->
  <div class="keypad">
    <button class="key active" data-ch="1">1<small>随机</small></button>
    <button class="key" data-ch="2">2<small>红心</small></button>
    <button class="key locked" data-ch="3">3<small>待解锁</small></button>
    <button class="key locked" data-ch="4">4<small>待解锁</small></button>
    <button class="key locked" data-ch="5">5<small>待解锁</small></button>
    <button class="key locked" data-ch="6">6<small>待解锁</small></button>
    <button class="key locked" data-ch="7">7<small>待解锁</small></button>
    <button class="key locked" data-ch="8">8<small>待解锁</small></button>
    <button class="key locked" data-ch="9">9<small>待解锁</small></button>
    <button class="key" data-key="*" aria-label="星号键：网页跳转，再按一次确认">*</button>
    <button class="key" data-key="0" aria-label="0 键，暂未开放">0</button>
    <button class="key" data-key="#" aria-label="井号键，按序号点歌，再按一次确认">#</button>
  </div>

  <!-- 隐藏输入 -->
  <input type="file" id="folder-input" webkitdirectory multiple style="display:none;">

  <!-- Toast -->
  <div id="toast" style="display:none;"></div>
</div>

<script src="app.js?v=15"></script>
</body>
</html>
